name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: stable

jobs:
  apk:
    name: Test + build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ubuntu runners do not guarantee sdkmanager is on PATH.
      # This action installs Android command-line tools, accepts SDK licenses,
      # installs the requested SDK packages, and adds sdkmanager/adb to PATH.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.1
            build-tools;36.0.0

      - name: Verify Android SDK tools
        run: |
          set -euo pipefail
          command -v sdkmanager
          command -v adb
          sdkmanager --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot + Android templates
        run: |
          set -euo pipefail
          VERSION="${GODOT_VERSION}-${GODOT_RELEASE}"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL" .ci build/android
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip" -o .ci/godot.zip
          unzip -q -o .ci/godot.zip -d .ci
          chmod +x ".ci/Godot_v${VERSION}_linux.x86_64"
          if [ ! -f "$TPL/android_debug.apk" ]; then
            curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz" -o .ci/templates.tpz
            unzip -q -o .ci/templates.tpz -d "$TPL"
            if [ -d "$TPL/templates" ]; then mv "$TPL/templates"/* "$TPL"/; rmdir "$TPL/templates"; fi
          fi

      - name: Import + headless smoke tests
        run: |
          set -euo pipefail
          GODOT=".ci/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          test -s assets/audio/ui_tap_audio.mp3
          test -s assets/audio/stab.mp3
          test -s assets/audio/suspect.mp3
          test -s assets/audio/stab2.mp3
          test -s assets/audio/suspect2.mp3
          python3 tools/test_v71_source_integrity.py
          "$GODOT" --headless --path . --import
          # All suites exercise saves; never write to an existing save.
          TEST_DATA="$(mktemp -d)"
          trap 'rm -rf "$TEST_DATA"' EXIT
          mkdir -p "$TEST_DATA/smoke" "$TEST_DATA/reference" "$TEST_DATA/movement" "$TEST_DATA/roaming" "$TEST_DATA/transition" "$TEST_DATA/home" "$TEST_DATA/combat" "$TEST_DATA/collision" "$TEST_DATA/splash"
          XDG_DATA_HOME="$TEST_DATA/smoke" timeout 120 "$GODOT" --headless --path . --script tests/smoke_test.gd
          XDG_DATA_HOME="$TEST_DATA/reference" timeout 120 "$GODOT" --headless --path . --script tests/reference_test.gd
          XDG_DATA_HOME="$TEST_DATA/movement" timeout 120 "$GODOT" --headless --path . --script tests/movement_test.gd
          XDG_DATA_HOME="$TEST_DATA/roaming" timeout 120 "$GODOT" --headless --path . --script tests/roaming_test.gd
          XDG_DATA_HOME="$TEST_DATA/transition" timeout 120 "$GODOT" --headless --path . --script tests/transition_test.gd
          XDG_DATA_HOME="$TEST_DATA/home" timeout 120 "$GODOT" --headless --path . --script tests/home_test.gd
          XDG_DATA_HOME="$TEST_DATA/combat" timeout 120 "$GODOT" --headless --path . --script tests/combat_test.gd
          XDG_DATA_HOME="$TEST_DATA/collision" timeout 120 "$GODOT" --headless --path . --script tests/collision_test.gd
          XDG_DATA_HOME="$TEST_DATA/splash" timeout 120 "$GODOT" --headless --path . --script tests/splash_test.gd
          mkdir -p "$TEST_DATA/layout" "$TEST_DATA/gate" "$TEST_DATA/enemy-types"
          XDG_DATA_HOME="$TEST_DATA/layout" timeout 120 "$GODOT" --headless --path . --script tests/layout_test.gd
          XDG_DATA_HOME="$TEST_DATA/gate" timeout 120 "$GODOT" --headless --path . --script tests/gate_test.gd
          XDG_DATA_HOME="$TEST_DATA/enemy-types" timeout 120 "$GODOT" --headless --path . --script tests/enemy_types_test.gd
          mkdir -p "$TEST_DATA/player-path" "$TEST_DATA/loot-speed" "$TEST_DATA/button-feedback" "$TEST_DATA/tap-audio"
          XDG_DATA_HOME="$TEST_DATA/player-path" timeout 120 "$GODOT" --headless --path . --script tests/player_path_test.gd
          XDG_DATA_HOME="$TEST_DATA/loot-speed" timeout 120 "$GODOT" --headless --path . --script tests/loot_speed_test.gd
          XDG_DATA_HOME="$TEST_DATA/button-feedback" timeout 120 "$GODOT" --headless --path . --script tests/button_feedback_test.gd
          XDG_DATA_HOME="$TEST_DATA/tap-audio" timeout 120 "$GODOT" --headless --path . --script tests/tap_audio_import_test.gd
          mkdir -p "$TEST_DATA/v64-lockers" "$TEST_DATA/v64-combat" "$TEST_DATA/v64-path" "$TEST_DATA/v64-traffic"
          XDG_DATA_HOME="$TEST_DATA/v64-lockers" timeout 120 "$GODOT" --headless --path . --script tests/v64_lockers_test.gd
          XDG_DATA_HOME="$TEST_DATA/v64-combat" timeout 120 "$GODOT" --headless --path . --script tests/v64_combat_test.gd
          XDG_DATA_HOME="$TEST_DATA/v64-path" timeout 300 "$GODOT" --headless --path . --script tests/v64_path_stress_test.gd
          XDG_DATA_HOME="$TEST_DATA/v64-traffic" timeout 300 "$GODOT" --headless --path . --script tests/v64_traffic_stress_test.gd
          mkdir -p "$TEST_DATA/v65-combat-audio"
          XDG_DATA_HOME="$TEST_DATA/v65-combat-audio" timeout 120 "$GODOT" --headless --path . --script tests/v65_combat_audio_test.gd
          mkdir -p "$TEST_DATA/v66-mechanics"
          XDG_DATA_HOME="$TEST_DATA/v66-mechanics" timeout 120 "$GODOT" --headless --path . --script tests/v66_mechanics_test.gd
          mkdir -p "$TEST_DATA/v67-behavior" "$TEST_DATA/v71-visual-sync" "$TEST_DATA/v71-start-safety"
          XDG_DATA_HOME="$TEST_DATA/v67-behavior" timeout 120 "$GODOT" --headless --path . --script tests/v67_behavior_test.gd
          XDG_DATA_HOME="$TEST_DATA/v71-visual-sync" timeout 120 "$GODOT" --headless --path . --script tests/v71_visual_sync_test.gd
          for SEED in 70000 71000 72000; do
            APEX_SAFETY_SEED="$SEED" XDG_DATA_HOME="$TEST_DATA/v71-start-safety-$SEED" timeout 120 "$GODOT" --headless --path . --script tests/v71_start_safety_test.gd
          done

      - name: Export debug APK
        run: |
          set -euo pipefail
          GODOT=".ci/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          if [ ! -d "$ANDROID_SDK" ]; then
            echo "Android SDK directory not found: $ANDROID_SDK" >&2
            exit 1
          fi
          export ANDROID_HOME="$ANDROID_SDK"
          export ANDROID_SDK_ROOT="$ANDROID_SDK"
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build/android
          adb start-server >/dev/null 2>&1 || true
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_SDK" "$DEBUG_KEYSTORE" > "$HOME/.config/godot/editor_settings-4.7.tres"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$DEBUG_KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          "$GODOT" --headless --path . --export-debug "Android" build/android/apex-assassin-debug.apk
          test -f build/android/apex-assassin-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apex-assassin-debug-${{ github.sha }}
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 14
