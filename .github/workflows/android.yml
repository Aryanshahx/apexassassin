name: Android APK - red scarf test

# Manual only: do not create an APK artifact or upload audio on every push.
on:
  workflow_dispatch:
    inputs:
      approve_test_art_and_audio:
        description: 'I approve temporary reference-derived art and project audio in this GitHub APK artifact'
        required: true
        default: false
        type: boolean
      run_extended_traffic:
        description: 'Also run the legacy 100-level traffic diagnostic (non-blocking; results reported)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-red-scarf-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: stable

jobs:
  apk:
    name: Test and build a debug preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require explicit review
        env:
          APPROVED: ${{ inputs.approve_test_art_and_audio }}
        run: |
          if [ "$APPROVED" != 'true' ]; then
            echo '::error::Preview art and project audio were not approved for this GitHub artifact. Nothing was built.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check all original audio before building
        run: |
          set -euo pipefail
          for f in ui_tap_audio.mp3 stab.mp3 suspect.mp3 stab2.mp3 suspect2.mp3 pickkey.mp3 unlockkey.mp3; do
            if [ ! -s "assets/audio/$f" ]; then
              echo "::error::Missing assets/audio/$f in this checkout. No silent replacement is generated."
              echo 'The Pi copy stays untouched. Add the recording only after approving GitHub upload and checking repository visibility.'
              exit 1
            fi
          done
          printf '%s  %s\n' \
            '0a54466fda929646f50264f93f6318a3d43db41677ef3832966aa2614620144a' 'assets/audio/pickkey.mp3' \
            'a8d967d2a27feec14ffc7694d0de00488b7720faf629e8c2853f97a1a4464e4c' 'assets/audio/unlockkey.mp3' | sha256sum --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.1
            build-tools;36.0.0
      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
      - name: Install Godot and Android templates
        run: |
          set -euo pipefail
          VERSION="${GODOT_VERSION}-${GODOT_RELEASE}"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL" .ci build/android
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip" -o .ci/godot.zip
          unzip -q -o .ci/godot.zip -d .ci
          chmod +x ".ci/Godot_v${VERSION}_linux.x86_64"
          if [ ! -f "$TPL/android_debug.apk" ]; then
            curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz" -o .ci/templates.tpz
            unzip -q -o .ci/templates.tpz -d "$TPL"
            if [ -d "$TPL/templates" ]; then mv "$TPL/templates"/* "$TPL"/; rmdir "$TPL/templates"; fi
          fi
      - name: Verify source geometry and run isolated tests
        run: |
          set -euo pipefail
          python3 tools/test_v72_source_integrity.py
          export GODOT="$PWD/.ci/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          bash tools/run_red_scarf_tests.sh
      - name: Optional legacy traffic diagnostic
        if: ${{ inputs.run_extended_traffic }}
        continue-on-error: true
        run: |
          set -euo pipefail
          TEST_TMP="$(mktemp -d)"
          trap 'rm -rf -- "$TEST_TMP"' EXIT
          mkdir -p "$TEST_TMP/data" "$TEST_TMP/config" "$TEST_TMP/cache"
          GODOT="$PWD/.ci/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          if ! XDG_DATA_HOME="$TEST_TMP/data" XDG_CONFIG_HOME="$TEST_TMP/config" XDG_CACHE_HOME="$TEST_TMP/cache" timeout 300 "$GODOT" --headless --path . --script tests/v64_traffic_stress_test.gd; then
            echo '::warning::Legacy traffic stress reported a failure or timeout. Review its log; the preview APK is not evidence that this issue is fixed.'
            echo 'Legacy traffic diagnostic reported a failure or timeout. Review its log.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Legacy traffic diagnostic passed in this run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        run: |
          set -euo pipefail
          GODOT="$PWD/.ci/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -d "$ANDROID_SDK"
          export ANDROID_HOME="$ANDROID_SDK" ANDROID_SDK_ROOT="$ANDROID_SDK"
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build/android
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_SDK" "$DEBUG_KEYSTORE" > "$HOME/.config/godot/editor_settings-4.7.tres"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$DEBUG_KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          "$GODOT" --headless --path . --export-debug 'Android' build/android/apex-red-scarf-preview-debug.apk
          test -s build/android/apex-red-scarf-preview-debug.apk
          echo 'This is a debug preview. A different signature cannot update an existing installation.'
      - uses: actions/upload-artifact@v4
        with:
          name: apex-red-scarf-preview-debug-${{ github.sha }}
          path: build/android/apex-red-scarf-preview-debug.apk
          if-no-files-found: error
          retention-days: 7
